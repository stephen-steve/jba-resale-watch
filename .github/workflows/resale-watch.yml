name: JBA resale watch

on:
  schedule:
    # 5分ごと（GitHub 側の混雑で数分遅れることがあります）
    - cron: '*/5 * * * *'
  workflow_dispatch:   # 手動実行用ボタン

permissions:
  contents: write      # state.json の書き戻しに必要

concurrency:
  group: resale-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check resale listings
        env:
          # 監視したいイベント。カンマ区切りで複数可
          EVENT_ID: '0647c25d-cb81-4cf1-8914-3a6b3393987c'
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python check.py

      - name: Commit state
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "update state"
            git push
          else
            echo "no change"
          fi
